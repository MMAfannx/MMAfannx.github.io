<style>
:root{--gold:#E8B43A;--red:#E0182D;--bg:#0B0B0E;--card:#15171C;--muted:#A3A3AD}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(120% 70% at 50% 0%,#2a1a10 0%,var(--bg) 60%);color:#fff;font-family:Cairo,system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:40px 16px 32px;text-align:center}
.icon{width:120px;height:120px;border-radius:28px;box-shadow:0 0 50px rgba(232,180,58,.35),0 8px 24px rgba(0,0,0,.6)}
h1{font-size:30px;font-weight:900;margin-top:18px;letter-spacing:.5px;direction:ltr}
h1 b{color:var(--gold)}h1 span{background:var(--red);padding:0 10px;border-radius:8px;margin-left:6px}
p.sub{color:#ddd;font-size:17px;font-weight:600;margin:8px 0 26px}
a.btn{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;background:var(--card);border:1.5px solid #2c2f37;border-radius:18px;padding:14px 18px;margin:12px 0;transition:transform .1s}
a.btn:active{transform:scale(.98)}
a.primary{background:var(--gold);color:#111;border-color:var(--gold);justify-content:center;font-size:22px;font-weight:900;padding:18px}
.store{direction:ltr;justify-content:flex-start}
.store svg{width:36px;height:36px;flex:none}
.store small{display:block;font-size:12px;color:var(--muted);font-weight:600;line-height:1.2}
.store strong{display:block;font-size:22px;font-weight:800;line-height:1.2}
.shop{justify-content:space-between;border-color:var(--red)}
.shop .t{text-align:right}.shop strong{font-size:20px;font-weight:900;display:block}.shop small{color:var(--muted);font-size:14px;font-weight:600}
.shop .arrow{color:var(--red);font-size:26px;font-weight:900}
h2{font-size:15px;color:var(--muted);font-weight:700;margin:26px 0 4px}
footer{color:#666;font-size:12px;margin-top:28px}
</style>
</head>
